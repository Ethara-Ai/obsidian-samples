      - MOCK_ADMIN_ALLOWLIST=${MOCK_ADMIN_ALLOWLIST:-}
      - MOCK_ADMIN_TOKEN=${MOCK_ADMIN_TOKEN:-}
    expose:
      - "8084"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8084/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M
